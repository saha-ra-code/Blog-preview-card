<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
   <link rel="stylesheet" href="css/style.css">

   <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">

   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">

   <title>Frontend Mentor | Blog preview card</title>
   <style>
      .attribution {font-size: 0.6875rem; text-align: center;}
      .attribution a {color: hsl(228, 45%, 44%);}
   </style>
</head>

<body>
   <main>
      <article class="card">
         <img class="illustration" src="images/illustration-article.svg" alt="Illustration for the article">
         <section class="text">
            <p class="learning">Learning</p>

            <p class="published">Published 21 Dec 2023</p>

            <h1><a href="#">HTML & CSS foundations</a></h1>

            <p class="content">These languages are the backbone of every website, defining structure, content, and presentation.</p>

            <div class="author">
               <img class="avatar" src="images/image-avatar.webp" alt="Greg Hooper face">
               <p class="name">Greg Hooper</p>
            </div>
         </section>
      </article>
   </main>
  
   <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
      Coded by <a href="#">Sasha Shulmann</a>.
</footer>
</body>


</html>
